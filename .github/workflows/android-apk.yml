name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find project and Create debug keystore
        run: |
          ls -la
          find . -name "gradlew" -type f
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true
          find . -name "debug.keystore" -type f

      - name: Build APK
        run: |
          chmod +x $(find . -name "gradlew" | head -n 1)
          $(find . -name "gradlew" | head -n 1) assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MedTime-APK
          path: "**/build/outputs/apk/debug/app-debug.apk"
